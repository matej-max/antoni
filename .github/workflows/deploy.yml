name: Deploy náhľadu (a, b)
on:
  push:
    branches: [main]
    paths: ['deploy/**', '.github/workflows/deploy.yml']
  workflow_dispatch:
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Nahrať a/ a b/ cez SFTP
        env:
          HOST: ${{ secrets.SFTP_HOST }}
          PORT: ${{ secrets.SFTP_PORT }}
          USER: ${{ secrets.SFTP_LOGIN }}
          PASS: ${{ secrets.SFTP_PASSWORD }}
        run: |
          set -o pipefail
          sudo apt-get install -y -qq sshpass >/dev/null 2>&1
          cd deploy
          # subdomény a./b.antoni.restaurant majú koreň v <doména>/sub/a a /sub/b
          # dávka: vytvor adresáre (chyba „už existuje“ sa ignoruje cez „-“), potom nahraj súbory
          {
            echo "cd \"$HOST/sub\""
            echo "pwd"
            find a b -type d | sort | sed 's/^/-mkdir /'
            find a b -type f | sort | sed 's/.*/put "&" "&"/'
            echo "ls -1"
          } > ../batch.txt
          echo "príkazov: $(wc -l < ../batch.txt)"
          sshpass -p "$PASS" sftp -o BatchMode=no -o StrictHostKeyChecking=no -o PubkeyAuthentication=no \
            -o PreferredAuthentications=password -P "${PORT:-22}" -b ../batch.txt "$USER@$HOST" 2>&1 \
            | { grep -v -E "^sftp> (put|-mkdir)|^Uploading|post-quantum|store now|upgraded" || true; }
