name: Diagnostika SFTP
on: workflow_dispatch
jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - name: Test spojenia
        env:
          HOST: ${{ secrets.SFTP_HOST }}
          PORT: ${{ secrets.SFTP_PORT }}
          USER: ${{ secrets.SFTP_LOGIN }}
          PASS: ${{ secrets.SFTP_PASSWORD }}
        run: |
          sudo apt-get install -y -qq sshpass lftp >/dev/null 2>&1
          echo "port=$PORT"
          printf 'pwd\nls -1\n' > b.txt
          echo "--- sftp (prve spojenie)"; sshpass -p "$PASS" sftp -o StrictHostKeyChecking=no -o PubkeyAuthentication=no -o PreferredAuthentications=password -P "${PORT:-22}" -b b.txt "$USER@$HOST" 2>&1 | grep -v -i -E "post-quantum|store now|upgraded" | tail -25
