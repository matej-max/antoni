<!doctype html>
<html lang="sk" class="no-js">

<meta charset="utf-8">

<title>{{meta:title}}</title>
<meta name="description" content="{{meta:desc}}">
<meta name="theme-color" content="#120806">
<meta property="og:type" content="website">
<meta property="og:site_name" content="Antoni restaurant">

<meta property="og:image" content="assets/img/stol-hore-siroky-1600.webp">

<link rel="stylesheet" href="assets/css/antoni.css?v={{ver}}">
<link rel="stylesheet" href="assets/css/klasik.css?v={{ver}}">
<script>
  (function (d) {
    var r = d.documentElement; r.classList.remove('no-js'); r.classList.add('js');
    if (!window.matchMedia('(prefers-reduced-motion: reduce)').matches) {
      r.classList.add('has-motion');
      window.__motionFallback = setTimeout(function () { r.classList.remove('has-motion'); }, 3500);
    }
  })(document);
</script>
