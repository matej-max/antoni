<div class="sheet" id="dish-sheet" data-sheet hidden>
  <div class="sheet__backdrop" data-sheet-close></div>
  <div class="sheet__panel" role="dialog" aria-modal="true" aria-labelledby="dish-sheet-title">
    <div class="sheet__grip" aria-hidden="true"></div>
    <button class="icon-btn sheet__close" type="button" data-sheet-close aria-label="Zavrieť">{{icon:close}}</button>
    <div data-sheet-body></div>
  </div>
</div>
<div class="sheet today-sheet" id="today-sheet" data-sheet hidden>
  <div class="sheet__backdrop" data-sheet-close></div>
  <div class="sheet__panel" role="dialog" aria-modal="true" aria-labelledby="today-sheet-title">
    <div class="sheet__grip" aria-hidden="true"></div>
    <button class="icon-btn sheet__close" type="button" data-sheet-close aria-label="Zavrieť">{{icon:close}}</button>
    <div data-sheet-body></div>
  </div>
</div>
